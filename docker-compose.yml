services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: careops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-careops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careops-network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./careops-backend
      dockerfile: Dockerfile
    container_name: careops-backend
    restart: unless-stopped
    environment:
      # Database (connects to db service via Docker network)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-careops}
      # Secrets (defaults for development only - override in production!)
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-immediately}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      # App
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      FRONTEND_URL: http://localhost:3000
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://frontend:3000"]'
      # AI (optional)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Email (optional)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      # WhatsApp (optional)
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-careops_whatsapp_verify}
      # Slack (optional)
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - careops-network

  # Frontend (Next.js) - Development mode
  frontend:
    build:
      context: ./careops-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: careops-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - careops-network

volumes:
  postgres_data:
    driver: local

networks:
  careops-network:
    driver: bridge
