name: CareOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================
  # LINT & TYPE CHECK
  # =============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Frontend linting
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: careops-frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd careops-frontend
          npm ci

      - name: Run ESLint
        run: |
          cd careops-frontend
          npm run lint || true

      # Backend linting
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: careops-backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd careops-backend
          pip install -r requirements.txt

      - name: Run Python linters
        run: |
          cd careops-backend
          pip install ruff flake8
          ruff check . || true
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  # =============================================
  # BACKEND TESTS
  # =============================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: careops_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd careops-backend
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/careops_test
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci
        run: |
          cd careops-backend
          pytest tests/ -v --ignore=tests/integration || true

  # =============================================
  # BUILD FRONTEND
  # =============================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: careops-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd careops-frontend
          npm ci

      - name: Build Next.js
        run: |
          cd careops-frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: careops-frontend/.next
          retention-days: 7

  # =============================================
  # BUILD BACKEND DOCKER
  # =============================================
  build-backend:
    name: Build Backend Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./careops-backend
          push: false
          tags: careops-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================
  # DEPLOY TO STAGING (on main push)
  # =============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, build-frontend, build-backend]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render/Railway
        run: |
          # Add deployment script here for your provider
          echo "Deploying to staging..."
          # Example: Using Render API
          # curl -X POST $RENDER_DEPLOY_HOOK

  # =============================================
  # DEPLOY TO PRODUCTION (on tag)
  # =============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, build-frontend, build-backend]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Frontend)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Deploy to Railway (Backend)
        run: |
          # Add Railway deployment here
          echo "Deploying backend to Railway..."
          # npm i -g @railway/cli
          # railway up --token ${{ secrets.RAILWAY_TOKEN }}
